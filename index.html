<style>

splay:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}.stat{background:white;padding:20px 22px;border:1px solid var(--line);border-radius:13px}.stat label{color:var(--muted)}.stat strong{display:block;font-size:30px;margin-top:9px;color:var(--navy)}.stat small{color:var(--green)}.panel{background:#fff;border-radius:14px;border:1px solid var(--line);margin-bottom:18px;overflow:hidden}.panel-head{padding:18px 22px;display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.panel-head h2{font-size:16px;margin:0}.panel-body{padding:20px}.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.folder{display:flex;align-items:center;gap:13px;padding:18px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;min-width:0}.folder:hover{border-color:#6ab7ad;background:#f8fffe}.folder-icon{background:#e7f5f1;padding:12px;border-radius:11px;font-size:21px}.folder b{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.folder small{color:var(--muted)}.folder .count{margin-left:auto;color:var(--green);font-weight:700;white-space:nowrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;background:#fff}.toolbar input{flex:2;min-width:190px}.toolbar select{flex:1;min-width:130px}input,select,textarea{border:1px solid #d7e2e9;background:white;border-radius:9px;padding:10px 12px;min-width:0;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #93d5cc}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:13px 20px;text-align:left;border-bottom:1px solid #edf1f5}th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);background:#f9fbfd}td:nth-child(2){font-weight:600}tr:hover td{background:#fbfdfd}.pill{background:#e9f5f3;border-radius:99px;padding:5px 9px;color:#097c70;font-size:11px;font-weight:700}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.crumb{display:flex;gap:8px;align-items:center;margin-bottom:20px;color:#778898;flex-wrap:wrap}.crumb button{border:0;background:none;color:var(--green);padding:0}.sub-list{display:grid;gap:9px}.sub{border:1px solid var(--line);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:15px;text-align:left;background:white}.sub:hover{background:#f4faf9}.sub b{display:block}.sub small{color:var(--muted);display:block}.sub .pill{margin-left:auto}.muted{color:var(--muted)}.link{background:none;border:0;color:var(--green);font-weight:700;padding:2px 5px}.link.red{color:#b94444}dialog{border:0;border-radius:16px;padding:0;width:min(600px,calc(100% - 25px));box-shadow:0 20px 100px #0b1b2b60}dialog::backdrop{background:#1022398c}.modal-head{padding:20px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.modal-body{padding:22px 25px;max-height:70vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:650;font-size:12px}.field small{color:var(--muted)}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.close{border:0;background:#edf2f6;border-radius:7px;padding:5px 10px}.note{padding:13px 16px;background:#e9f5f3;border-radius:9px;color:#206d65;margin-bottom:17px}.notice{background:#fff8e8;border:1px solid #f0dfb0;padding:14px 18px;border-radius:9px;color:#826329;margin-bottom:22px}.details{white-space:normal;max-width:240px}.year-chip{padding:8px 12px;border-radius:9px;background:#f2f6f9;color:var(--navy);border:1px solid #e2eaf0}.year-chip.active{background:#e6f6f2;border-color:#70bfb4}.years{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}@media(max-width:950px){aside{position:static;width:auto}.brand{padding:12px 18px}.nav-head,aside .nav{display:none}main{margin-left:0}.top{padding:0 18px}.page{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.folders{grid-template-columns:1fr}}@media(max-width:550px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.heading{align-items:start;flex-direction:column}.form-grid{grid-template-columns:1fr}.top span{display:none}}
</style></head><body>
<aside><div class="brand"><div class="emblem">🏛️</div><div><b>SIDIK KONTARA</b><small>Kabupaten Konawe Utara</small></div></div><div class="nav-head">Menu utama</div><button class="nav active" data-nav="home">▦ &nbsp; Dashboard</button><button class="nav" data-nav="all">▤ &nbsp; Semua Arsip</button><div class="nav-head">Struktur Arsip</div><div id="sidenav"></div><div class="nav-head">Pengelolaan</div><button class="nav" data-nav="backup">⇩ &nbsp; Cadangkan / Pulihkan</button></aside>
<main><header class="top"><div><strong>Badan Kesatuan Bangsa dan Politik</strong><br><span>Bidang Ideologi, Wawasan Kebangsaan dan Karakter Bangsa</span></div><div class="pill">● Sistem Arsip Digital</div></header><div class="page"><div id="content"></div></div></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title">Tambah Arsip</h2><button class="close" onclick="document.getElementById('modal').close()">✕</button></div><div class="modal-body"><form id="archiveform"><div class="form-grid"><div class="field full"><label>Nama Dokumen *</label><input name="title" required maxlength="180" placeholder="Contoh: Laporan Sosialisasi Pancasila"></div><div class="field"><label>Kategori *</label><select name="category" id="fcategory" required></select></div><div class="field"><label>Subfolder *</label><select name="subfolder" id="fsubfolder" required></select></div><div class="field"><label>Tahun Anggaran *</label><input type="number" name="year" min="2000" max="2100" required></div><div class="field"><label>Tanggal Dokumen</label><input type="date" name="date"></div><div class="field"><label>Nomor Surat / Dokumen</label><input name="number" placeholder="Opsional"></div><div class="field"><label>Asal / Unit</label><input name="origin" placeholder="Opsional"></div><div class="field full"><label>Keterangan</label><textarea rows="3" name="notes" placeholder="Ringkasan atau informasi tambahan"></textarea></div><div class="field full"><label>Unggah File (PDF, gambar, Word, Excel, dll.)</label><input id="fileinput" type="file" name="file"><small>Disimpan di penyimpanan browser ini. Disarankan satu berkas maksimal 25 MB.</small></div></div><div class="footer-actions"><button type="button" class="btn secondary" onclick="document.getElementById('modal').close()">Batal</button><button class="btn" type="submit">Simpan Arsip</button></div></form></div></dialog>
<script>
const STRUCTURE=[{"code": "ARK-01", "name": "📜 REGULASI & DASAR HUKUM", "children": [{"code": "ARK-01.01", "name": "Peraturan Perundang-undangan", "description": "UU, PP, Perpres terkait ideologi & kebangsaan", "type": "Regulasi"}, {"code": "ARK-01.02", "name": "Peraturan Daerah (Perda) terkait", "description": "Perda Kabupaten Konawe Utara", "type": "Regulasi"}, {"code": "ARK-01.03", "name": "Surat Keputusan (SK) Kepala Badan", "description": "SK internal dan eksternal", "type": "Keputusan"}, {"code": "ARK-01.04", "name": "Instruksi / Edaran", "description": "Surat edaran dan instruksi dinas", "type": "Surat Dinas"}]}, {"code": "ARK-02", "name": "📋 PROGRAM & KEGIATAN", "children": [{"code": "ARK-02.01", "name": "Rencana Kerja Tahunan (Renja)", "description": "Renja per tahun anggaran", "type": "Perencanaan"}, {"code": "ARK-02.02", "name": "Laporan Pelaksanaan Kegiatan", "description": "Laporan setiap kegiatan yang dilaksanakan", "type": "Laporan"}, {"code": "ARK-02.03", "name": "Dokumentasi Kegiatan (foto, video)", "description": "Dokumentasi visual kegiatan", "type": "Multimedia"}, {"code": "ARK-02.04", "name": "Jadwal Kegiatan", "description": "Kalender dan jadwal program", "type": "Perencanaan"}]}, {"code": "ARK-03", "name": "🦅 IDEOLOGI PANCASILA", "children": [{"code": "ARK-03.01", "name": "Materi Sosialisasi Pancasila", "description": "Bahan sosialisasi, presentasi, leaflet", "type": "Materi"}, {"code": "ARK-03.02", "name": "Laporan Kegiatan Pemantapan Ideologi", "description": "Laporan setiap kegiatan pemantapan", "type": "Laporan"}, {"code": "ARK-03.03", "name": "Data Organisasi Masyarakat terkait", "description": "Data Ormas yang berkaitan dengan ideologi", "type": "Data"}, {"code": "ARK-03.04", "name": "Hasil Survei / Penelitian", "description": "Laporan survei kondisi ideologi", "type": "Kajian"}]}, {"code": "ARK-04", "name": "🇮🇩 WAWASAN KEBANGSAAN", "children": [{"code": "ARK-04.01", "name": "Modul & Materi Pelatihan", "description": "Modul Bimtek, diktat, materi ajar", "type": "Materi"}, {"code": "ARK-04.02", "name": "Laporan Bimtek / Diklat", "description": "Laporan kegiatan pelatihan wawasan kebangsaan", "type": "Laporan"}, {"code": "ARK-04.03", "name": "Data Peserta Kegiatan", "description": "Daftar hadir dan biodata peserta", "type": "Data"}, {"code": "ARK-04.04", "name": "Sertifikat & Piagam", "description": "Scan sertifikat peserta dan narasumber", "type": "Dokumen Resmi"}]}, {"code": "ARK-05", "name": "🌱 KARAKTER BANGSA", "children": [{"code": "ARK-05.01", "name": "Program Pembinaan Karakter", "description": "Dokumen program dan rencana kegiatan", "type": "Perencanaan"}, {"code": "ARK-05.02", "name": "Data Sasaran / Penerima Manfaat", "description": "Data kelompok sasaran kegiatan", "type": "Data"}, {"code": "ARK-05.03", "name": "Laporan Evaluasi", "description": "Hasil evaluasi program karakter bangsa", "type": "Laporan"}, {"code": "ARK-05.04", "name": "Dokumentasi Kegiatan", "description": "Foto dan video kegiatan pembinaan", "type": "Multimedia"}]}, {"code": "ARK-06", "name": "✉️ SURAT MENYURAT", "children": [{"code": "ARK-06.01", "name": "Surat Masuk", "description": "Seluruh surat masuk ke bidang", "type": "Surat Dinas"}, {"code": "ARK-06.02", "name": "Surat Keluar", "description": "Seluruh surat keluar dari bidang", "type": "Surat Dinas"}, {"code": "ARK-06.03", "name": "Nota Dinas Internal", "description": "Nota dinas antar unit di Kesbangpol", "type": "Surat Internal"}, {"code": "ARK-06.04", "name": "Surat Kerjasama / MoU", "description": "Dokumen perjanjian kerjasama", "type": "Perjanjian"}]}, {"code": "ARK-07", "name": "📊 LAPORAN & EVALUASI", "children": [{"code": "ARK-07.01", "name": "Laporan Bulanan", "description": "Laporan realisasi kegiatan per bulan", "type": "Laporan"}, {"code": "ARK-07.02", "name": "Laporan Triwulan", "description": "Laporan per 3 bulan", "type": "Laporan"}, {"code": "ARK-07.03", "name": "Laporan Tahunan", "description": "Laporan kinerja tahunan bidang", "type": "Laporan"}, {"code": "ARK-07.04", "name": "LAKIP / LKjIP Bidang", "description": "Laporan Akuntabilitas Kinerja", "type": "Laporan Resmi"}]}, {"code": "ARK-08", "name": "📈 DATA & STATISTIK", "children": [{"code": "ARK-08.01", "name": "Data Ormas & LSM", "description": "Database organisasi masyarakat dan LSM", "type": "Data"}, {"code": "ARK-08.02", "name": "Data Pemantauan Ideologi", "description": "Hasil pemantauan kondisi ideologi daerah", "type": "Data"}, {"code": "ARK-08.03", "name": "Rekapitulasi Kegiatan", "description": "Rekap seluruh kegiatan bidang", "type": "Data"}, {"code": "ARK-08.04", "name": "Peta Potensi Konflik", "description": "Pemetaan potensi konflik sosial", "type": "Kajian"}]}, {"code": "ARK-09", "name": "📚 REFERENSI & PUSTAKA", "children": [{"code": "ARK-09.01", "name": "Buku & Modul Kebangsaan", "description": "Buku referensi kebangsaan dan ideologi", "type": "Pustaka"}, {"code": "ARK-09.02", "name": "Jurnal / Artikel", "description": "Jurnal ilmiah dan artikel terkait", "type": "Pustaka"}, {"code": "ARK-09.03", "name": "Materi Narasumber", "description": "Slide dan materi dari narasumber kegiatan", "type": "Materi"}, {"code": "ARK-09.04", "name": "Hasil Kajian", "description": "Laporan dan dokumen hasil kajian bidang", "type": "Kajian"}]}, {"code": "ARK-10", "name": "🤝 KERJASAMA & KOORDINASI", "children": [{"code": "ARK-10.01", "name": "Nota Kesepahaman (MoU)", "description": "Dokumen MoU dengan instansi/lembaga lain", "type": "Perjanjian"}, {"code": "ARK-10.02", "name": "Laporan Koordinasi Lintas OPD", "description": "Notulen dan laporan rapat koordinasi", "type": "Laporan"}, {"code": "ARK-10.03", "name": "Surat Rekomendasi", "description": "Surat rekomendasi yang diterbitkan bidang", "type": "Surat Dinas"}]}];
const DB='kesbangpol-archive-v1';let db;let view={kind:'home',category:null,subfolder:null,year:null,search:''};let editing=null;
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allSub=STRUCTURE.flatMap(c=>c.children.map(s=>({...s,parent:c.code,parentName:c.name})));const nameOf=code=>allSub.find(s=>s.code===code)?.name||code;const parentOf=code=>allSub.find(s=>s.code===code)?.parent||'';
function dbOpen(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{let store=req.result.createObjectStore('archives',{keyPath:'id'});store.createIndex('subfolder','subfolder')};req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}
function transaction(mode='readonly'){return db.transaction('archives',mode).objectStore('archives')}
const getAll=()=>new Promise((res,rej)=>{let r=transaction().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getOne=id=>new Promise((res,rej)=>{let r=transaction().get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const put=r=>new Promise((res,rej)=>{let q=transaction('readwrite').put(r);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
const del=id=>new Promise((res,rej)=>{let q=transaction('readwrite').delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)});
let records=[];
const hits=(s)=>records.filter(r=>r.subfolder===s);const filtered=()=>records.filter(r=>(!view.category||r.category===view.category)&&(!view.subfolder||r.subfolder===view.subfolder)&&(!view.year||String(r.year)===String(view.year))&&(!view.search||[r.title,r.number,r.origin,r.notes,r.subfolder,nameOf(r.subfolder),r.year].join(' ').toLowerCase().includes(view.search.toLowerCase())));
function side(){ $('#sidenav').innerHTML=STRUCTURE.map(c=>`<button class="nav" data-nav="cat" data-code="${c.code}">${esc(c.name)} <small>${c.children.length}</small></button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',(view.kind==='home'&&b.dataset.nav==='home')||(view.kind==='all'&&b.dataset.nav==='all')||(view.kind==='backup'&&b.dataset.nav==='backup')||(view.category===b.dataset.code)));}
function setView(kind,category=null,subfolder=null){view={kind,category,subfolder,year:null,search:''};render()}
function head(title,subtitle,button=true){return `<div class="heading"><div><div class="eyebrow">E-Arsip • Kesbangpol Konawe Utara</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${button?'<button class="btn" id="add">＋ Tambah Arsip</button>':''}</div>`}
function crumbs(){let c=STRUCTURE.find(c=>c.code===view.category);return `<div class="crumb"><button data-go="home">Dashboard</button>${c?' / <button data-go="cat" data-code="'+c.code+'">'+esc(c.name)+'</button>':''}${view.subfolder?' / '+esc(nameOf(view.subfolder)):''}</div>`}
function table(list){return `<div class="panel"><div class="panel-head"><h2>Daftar Dokumen <span class="muted">(${list.length})</span></h2><span class="muted">Terurut berdasarkan terbaru</span></div><div class="table-wrap"><table><thead><tr><th>Nama Dokumen</th><th>Kode Arsip</th><th>Jenis</th><th>Tahun</th><th>Tanggal</th><th>Berkas</th><th>Aksi</th></tr></thead><tbody>${list.map(r=>`<tr><td><div class="details">${esc(r.title)}<br><small class="muted">${esc(r.number||nameOf(r.subfolder))}</small></div></td><td>${esc(r.subfolder)}</td><td><span class="pill">${esc(allSub.find(s=>s.code===r.subfolder)?.type||'Dokumen')}</span></td><td>${esc(r.year)}</td><td>${esc(r.date||'-')}</td><td>${r.fileName?`<button class="link" data-download="${esc(r.id)}">⬇ ${esc(r.fileName.length>20?r.fileName.slice(0,18)+'…':r.fileName)}</button>`:'<span class="muted">—</span>'}</td><td><button class="link" data-edit="${esc(r.id)}">Ubah</button> <button class="link red" data-delete="${esc(r.id)}">Hapus</button></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">📭<br><strong>Belum ada dokumen</strong><br>Gunakan tombol “Tambah Arsip” untuk menyimpan dokumen pertama.</div>'}</div></div>`}
function toolbar(){let years=[...new Set(records.map(r=>r.year))].sort((a,b)=>b-a);return `<div class="panel"><div class="toolbar"><input id="search" type="search" placeholder="🔎 Cari judul, nomor surat, atau keterangan..." value="${esc(view.search)}"><select id="year"><option value="">Semua Tahun</option>${years.map(y=>`<option value="${y}" ${String(view.year)===String(y)?'selected':''}>${y}</option>`).join('')}</select><button class="btn secondary" id="exportcsv">⇩ Ekspor CSV</button></div></div>`}
function folders(){return `<div class="panel"><div class="panel-head"><h2>Struktur Folder Arsip</h2><span class="muted">Sesuai lampiran Excel</span></div><div class="panel-body"><div class="folders">${STRUCTURE.map(c=>`<button class="folder" data-category="${c.code}"><span class="folder-icon">📁</span><span style="min-width:0"><b>${esc(c.name)}</b><small>${c.code} · ${c.children.length} subfolder</small></span><span class="count">${records.filter(r=>r.category===c.code).length}</span></button>`).join('')}</div></div></div>`}
function subs(c){return `<div class="panel"><div class="panel-head"><h2>Subfolder ${esc(c.code)}</h2><span class="muted">Klik subfolder untuk melihat dokumen</span></div><div class="panel-body"><div class="sub-list">${c.children.map(s=>`<button class="sub" data-subfolder="${s.code}"><span class="folder-icon">📂</span><span><b>${esc(s.name)}</b><small>${esc(s.code)} · ${esc(s.description)}</small></span><span class="pill">${hits(s.code).length} berkas</span></button>`).join('')}</div></div></div>`}
function dashboard(){return head('Dashboard Pengarsipan','Kelola dokumen bidang secara tertib, cepat, dan terstruktur.')+`<div class="notice">ℹ️ Versi ini adalah prototipe lokal: berkas hanya tersimpan pada browser/perangkat yang digunakan, belum di server bersama. Gunakan fitur cadangan secara rutin.</div>`+`<div class="stats"><div class="stat"><label>Total Dokumen</label><strong>${records.length}</strong><small>Arsip tersimpan</small></div><div class="stat"><label>Kategori Utama</label><strong>${STRUCTURE.length}</strong><small>Sesuai struktur Excel</small></div><div class="stat"><label>Subfolder Arsip</label><strong>${allSub.length}</strong><small>Kode arsip terstruktur</small></div><div class="stat"><label>Tahun Anggaran</label><strong>${new Set(records.map(r=>r.year)).size}</strong><small>Tahun dengan arsip</small></div></div>`+folders()+table([...records].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,6))}
function catpage(){let c=STRUCTURE.find(c=>c.code===view.category);return crumbs()+head(view.subfolder?nameOf(view.subfolder):c.name,view.subfolder?`${view.subfolder} · ${allSub.find(s=>s.code===view.subfolder)?.description}`:`${c.code} · ${c.children.length} subfolder`)+(view.subfolder?'':subs(c))+toolbar()+table(filtered())}
function allpage(){return head('Seluruh Dokumen','Telusuri semua arsip dari seluruh kategori dan tahun.')+toolbar()+table(filtered())}
function backuppage(){return head('Cadangan & Pemulihan','Ekspor atau pulihkan metadata dan berkas arsip dari perangkat ini.',false)+`<div class="notice">Cadangan berisi dokumen yang disimpan di browser ini. Simpan file cadangan di lokasi aman. Mengimpor cadangan dengan ID sama akan memperbarui arsip tersebut.</div><div class="panel"><div class="panel-body"><h2>Unduh cadangan lengkap</h2><p class="muted">Ekspor semua metadata dan isi berkas ke dalam satu file JSON. Berkas besar menghasilkan cadangan besar.</p><button class="btn" id="backupbtn">⇩ Unduh Cadangan JSON</button><hr style="border:0;border-top:1px solid #eee;margin:24px 0"><h2>Pulihkan cadangan</h2><p class="muted">Pilih file JSON yang sebelumnya diekspor dari aplikasi ini.</p><input type="file" id="restorefile" accept=".json,application/json"><button class="btn secondary" id="restorebtn">Pulihkan Data</button></div></div>`}
async function render(){records=await getAll();side();let out=view.kind==='home'?dashboard():view.kind==='backup'?backuppage():view.kind==='all'?allpage():catpage();$('#content').innerHTML=out;let add=$('#add');if(add)add.onclick=()=>openModal();let search=$('#search');if(search){search.oninput=e=>{view.search=e.target.value;const t=$('.table-wrap');if(t){let tmp=document.createElement('div');tmp.innerHTML=table(filtered());t.replaceWith(tmp.querySelector('.table-wrap'));$('.panel-head h2 span')?.remove()}};$('#year').onchange=e=>{view.year=e.target.value||null;render()};$('#exportcsv').onclick=exportCSV;}if($('#backupbtn'))$('#backupbtn').onclick=backup;if($('#restorebtn'))$('#restorebtn').onclick=restore;}
function updateSub(selected){let code=$('#fcategory').value;let cat=STRUCTURE.find(c=>c.code===code);$('#fsubfolder').innerHTML=cat.children.map(s=>`<option value="${s.code}" ${s.code===selected?'selected':''}>${esc(s.code)} · ${esc(s.name)}</option>`).join('')}
async function openModal(id){editing=id||null;$('#archiveform').reset();$('#modal-title').textContent=id?'Ubah Arsip':'Tambah Arsip';$('#fcategory').innerHTML=STRUCTURE.map(c=>`<option value="${c.code}">${esc(c.code)} · ${esc(c.name)}</option>`).join('');let r=id?await getOne(id):null;$('#fcategory').value=r?.category||view.category||STRUCTURE[0].code;updateSub(r?.subfolder||view.subfolder);$('#fcategory').onchange=()=>updateSub();const f=$('#archiveform');for(const k of ['title','year','date','number','origin','notes'])if(r&&f.elements[k])f.elements[k].value=r[k]||'';if(!r)f.elements.year.value=new Date().getFullYear();$('#modal').showModal()}
$('#archiveform').onsubmit=async e=>{e.preventDefault();let f=e.target;let old=editing?await getOne(editing):null;let file=f.elements.file.files[0];if(file&&file.size>25*1024*1024){alert('Ukuran berkas maksimal 25 MB.');return}let r={id:old?.id||crypto.randomUUID(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),title:f.elements.title.value.trim(),category:f.elements.category.value,subfolder:f.elements.subfolder.value,year:Number(f.elements.year.value),date:f.elements.date.value,number:f.elements.number.value,origin:f.elements.origin.value,notes:f.elements.notes.value,fileName:old?.fileName||'',fileType:old?.fileType||'',file:old?.file||null};if(file){r.file=file;r.fileName=file.name;r.fileType=file.type}try{await put(r);$('#modal').close();await render()}catch(err){alert('Gagal menyimpan. Kapasitas penyimpanan browser mungkin penuh: '+err.message)}};
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportCSV(){let rows=[['Kode Arsip','Kategori','Subfolder','Judul Dokumen','Tahun','Tanggal','Nomor','Asal','Keterangan','Nama Berkas'],...filtered().map(r=>[r.subfolder,STRUCTURE.find(c=>c.code===r.category)?.name,nameOf(r.subfolder),r.title,r.year,r.date,r.number,r.origin,r.notes,r.fileName])];downloadBlob(new Blob(['\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'data-arsip-kesbangpol.csv')}
const blobToBase64=b=>new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)});
async function backup(){try{let data=[];for(let r of records){data.push({...r,file:r.file?await blobToBase64(r.file):null})}downloadBlob(new Blob([JSON.stringify({app:'kesbangpol-archive-v1',version:1,date:new Date().toISOString(),records:data})],{type:'application/json'}),'cadangan-arsip-kesbangpol-'+new Date().toISOString().slice(0,10)+'.json')}catch(e){alert('Cadangan gagal: '+e.message)}}
async function restore(){let file=$('#restorefile').files[0];if(!file){alert('Pilih file cadangan JSON terlebih dahulu.');return}try{let obj=JSON.parse(await file.text());if(obj.app!=='kesbangpol-archive-v1'||!Array.isArray(obj.records))throw new Error('Format cadangan tidak valid');if(!confirm('Pulihkan '+obj.records.length+' arsip? Arsip dengan ID yang sama akan diperbarui.'))return;for(let r of obj.records){if(!r.id||!allSub.some(s=>s.code===r.subfolder))continue;if(r.file&&typeof r.file==='string'){let response=await fetch(r.file);r.file=await response.blob()}await put(r)}alert('Pemulihan selesai.');render()}catch(e){alert('Pemulihan gagal: '+e.message)}}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){setView(b.dataset.nav==='cat'?'cat':b.dataset.nav,b.dataset.code||null);return}if(b.dataset.category){setView('cat',b.dataset.category);return}if(b.dataset.subfolder){setView('cat',view.category,b.dataset.subfolder);return}if(b.dataset.go){setView(b.dataset.go==='home'?'home':'cat',b.dataset.code||null);return}if(b.dataset.edit){openModal(b.dataset.edit);return}if(b.dataset.delete){if(confirm('Hapus arsip ini beserta berkasnya secara permanen dari browser?')){await del(b.dataset.delete);render()}return}if(b.dataset.download){let r=await getOne(b.dataset.download);if(r?.file)downloadBlob(r.file,r.fileName||'arsip');return}});
dbOpen().then(render).catch(e=>{$('#content').innerHTML='<div class="notice">Penyimpanan lokal tidak tersedia. Gunakan browser modern dan izinkan penyimpanan situs.</div>';console.error(e)});
</script></body></html>
